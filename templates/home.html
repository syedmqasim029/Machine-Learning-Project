<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Predictor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #1e293b;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle glowing background orbs */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: 15%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(168, 85, 247, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
        }

        .section-tag {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #334155;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-control, .form-select {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .btn-predict {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.75rem;
            border-radius: 0.85rem;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            flex: 1;
        }

        .btn-predict:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
            transform: translateY(-2px);
            color: #fff;
        }

        .btn-reset {
            background: #f1f5f9;
            color: #475569;
            border: 1.5px solid #e2e8f0;
            padding: 0.85rem 1.5rem;
            border-radius: 0.85rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* Result card */
        .result-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 1.25rem;
            padding: 1.75rem;
            margin-top: 2rem;
            text-align: center;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.4s ease-out;
        }

        .result-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }

        .result-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .grade-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 0.85rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .glass-card { padding: 1.5rem; }
            .header-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Header -->
    <div class="header-section">
        <h1 class="header-title">Student Performance Predictor</h1>
    </div>

    <!-- Main Card -->
    <div class="glass-card">
        <form action="{{ url_for('predict_datapoint')}}" method="post" id="predictionForm">
            
            <!-- Demographic Profile Section -->
            <div class="section-tag">
                <i class="bi bi-person-badge-fill"></i> Demographic & Background Info
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-gender-ambiguous text-primary"></i> Gender
                    </label>
                    <select class="form-select" name="gender" required>
                        <option value="" disabled {% if not prev_data %}selected{% endif %}>Select gender</option>
                        <option value="male" {% if prev_data and prev_data.gender == 'male' %}selected{% endif %}>Male</option>
                        <option value="female" {% if prev_data and prev_data.gender == 'female' %}selected{% endif %}>Female</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-people-fill text-primary"></i> Race / Ethnicity
                    </label>
                    <select class="form-select" name="ethnicity" required>
                        <option value="" disabled {% if not prev_data %}selected{% endif %}>Select ethnicity</option>
                        <option value="group A" {% if prev_data and prev_data.ethnicity == 'group A' %}selected{% endif %}>Group A</option>
                        <option value="group B" {% if prev_data and prev_data.ethnicity == 'group B' %}selected{% endif %}>Group B</option>
                        <option value="group C" {% if prev_data and prev_data.ethnicity == 'group C' %}selected{% endif %}>Group C</option>
                        <option value="group D" {% if prev_data and prev_data.ethnicity == 'group D' %}selected{% endif %}>Group D</option>
                        <option value="group E" {% if prev_data and prev_data.ethnicity == 'group E' %}selected{% endif %}>Group E</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-mortarboard-fill text-primary"></i> Parental Education Level
                    </label>
                    <select class="form-select" name="parental_level_of_education" required>
                        <option value="" disabled {% if not prev_data %}selected{% endif %}>Select parent's education</option>
                        <option value="some high school" {% if prev_data and prev_data.parental_level_of_education == 'some high school' %}selected{% endif %}>Some High School</option>
                        <option value="high school" {% if prev_data and prev_data.parental_level_of_education == 'high school' %}selected{% endif %}>High School</option>
                        <option value="some college" {% if prev_data and prev_data.parental_level_of_education == 'some college' %}selected{% endif %}>Some College</option>
                        <option value="associate's degree" {% if prev_data and prev_data.parental_level_of_education == "associate's degree" %}selected{% endif %}>Associate's Degree</option>
                        <option value="bachelor's degree" {% if prev_data and prev_data.parental_level_of_education == "bachelor's degree" %}selected{% endif %}>Bachelor's Degree</option>
                        <option value="master's degree" {% if prev_data and prev_data.parental_level_of_education == "master's degree" %}selected{% endif %}>Master's Degree</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-egg-fried text-primary"></i> Lunch Type
                    </label>
                    <select class="form-select" name="lunch" required>
                        <option value="" disabled {% if not prev_data %}selected{% endif %}>Select lunch type</option>
                        <option value="standard" {% if prev_data and prev_data.lunch == 'standard' %}selected{% endif %}>Standard</option>
                        <option value="free/reduced" {% if prev_data and prev_data.lunch == 'free/reduced' %}selected{% endif %}>Free / Reduced</option>
                    </select>
                </div>
            </div>

            <hr class="my-4" style="border-color: #f1f5f9;">

            <!-- Academic Scores Section -->
            <div class="section-tag">
                <i class="bi bi-journal-check"></i> Academic Preparation & Scores
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12">
                    <label class="form-label">
                        <i class="bi bi-award-fill text-primary"></i> Test Preparation Course
                    </label>
                    <select class="form-select" name="test_preparation_course" required>
                        <option value="" disabled {% if not prev_data %}selected{% endif %}>Select preparation status</option>
                        <option value="none" {% if prev_data and prev_data.test_preparation_course == 'none' %}selected{% endif %}>None (Not Completed)</option>
                        <option value="completed" {% if prev_data and prev_data.test_preparation_course == 'completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-book-half text-primary"></i> Reading Score (0 - 100)
                    </label>
                    <input class="form-control score-input" type="number" name="reading_score" 
                           placeholder="Enter reading score" min="0" max="100" 
                           value="{{ prev_data.reading_score if prev_data else '' }}" required />
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="bi bi-pencil-square text-primary"></i> Writing Score (0 - 100)
                    </label>
                    <input class="form-control score-input" type="number" name="writing_score" 
                           placeholder="Enter writing score" min="0" max="100" 
                           value="{{ prev_data.writing_score if prev_data else '' }}" required />
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2 mt-4">
                <button class="btn-predict" type="submit">
                    <i class="bi bi-stars"></i> Predict Maths Score
                </button>
                <a href="{{ url_for('index') }}" class="btn-reset">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </a>
            </div>
        </form>

        <!-- Prediction Result Output -->
        {% if results is defined and results is not none and results != '' %}
        <div class="result-card">
            <div class="result-label">
                <i class="bi bi-check-circle-fill text-success"></i> Estimated Mathematics Score
            </div>
            <div class="result-score">{{ results }} <span style="font-size: 1.5rem; font-weight: 600; color: #94a3b8;">/ 100</span></div>
            
            {% if grade %}
            <div>
                <span class="grade-pill bg-{{ grade_color }} bg-opacity-10 text-{{ grade_color }} border border-{{ grade_color }} border-opacity-25">
                    <i class="bi bi-award"></i> Performance: {{ grade }}
                </span>
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</div>

<script>
    // Enforce 0 to 100 validation on number inputs
    document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('input', function() {
            if (this.value > 100) this.value = 100;
            if (this.value < 0 && this.value !== '') this.value = 0;
        });
    });
</script>

</body>
</html>
